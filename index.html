<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forst-Trainer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: #111613;
        }

        body {
            background-color: #111613;
            background-image: linear-gradient(rgba(17, 22, 19, 0.72), rgba(17, 22, 19, 0.85)), url("img/background.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: scroll;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #F2F5F3;
            min-height: 100dvh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ECRAN 1: START --- */
        #start-screen {
            width: 100%;
            max-width: 420px;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 36px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0px 2px 8px rgba(0, 0, 0, 0.8);
        }

        .subtitle {
            color: #9CA8A1;
            font-size: 15px;
            text-shadow: 0px 1px 4px rgba(0, 0, 0, 0.8);
        }

        .btn-primary {
            width: 100%;
            max-width: 353px;
            height: 54px;
            background: linear-gradient(180deg, rgba(68, 145, 97, 0.45) 0%, rgba(50, 112, 74, 0.45) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            color: #F2F5F3;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0px 8px 20px rgba(9, 13, 11, 0.50);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, background 0.3s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* --- ECRAN 2: QUIZ --- */
        #quiz-screen {
            display: none;
            width: 100%;
            max-width: 420px;
            min-height: 100svh;
            flex-direction: column;
            padding: 12px 20px calc(22px + env(safe-area-inset-bottom)) 20px;
        }

        #question-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .top-nav {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
        }

        .nav-icon {
            background: none;
            border: none;
            color: #F2F5F3;
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .nav-icon:hover {
            opacity: 1;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 12px;
        }

        .quiz-header h2 {
            font-size: 23px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 6px;
        }

        .quiz-header span {
            color: #9CA8A1;
            font-size: 13px;
        }

        .question-image {
            width: 100%;
            flex: 1 1 auto;
            min-height: 155px;
            max-height: 300px;
            object-fit: contain;
            border: none;
            border-radius: 0;
            box-shadow: none;
            margin-bottom: 12px;
        }

        .question-text {
            text-align: center;
            font-size: 13.5px;
            line-height: 1.45;
            color: #E2E8E4;
            margin-bottom: 14px;
        }

        .question-text p {
            margin-bottom: 6px;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: auto;
        }

        .option-btn {
            width: 100%;
            min-height: 52px;
            background: rgba(24, 38, 29, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #F2F5F3;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn.correct {
            background: rgba(27, 36, 31, 0.9);
            border-color: #4ADE80;
        }

        .option-btn.wrong {
            background: rgba(180, 55, 45, 0.8);
            border-color: #E05A47;
        }

        .result-box {
            display: none;
            text-align: center;
            background: rgba(24, 38, 29, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(74, 222, 128, 0.45);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 18px;
            box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.5);
        }

        .result-score {
            font-size: 40px;
            font-weight: 700;
            color: #4ADE80;
            margin: 8px 0;
        }

        .result-sub {
            color: #9CA8A1;
            font-size: 14px;
        }

        #next-btn {
            display: none;
            margin-top: 12px;
            width: 100%;
            height: 48px;
            background: rgba(59, 130, 86, 0.85);
            border: 1px solid rgba(74, 222, 128, 0.45);
            border-radius: 14px;
            color: #F2F5F3;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        /* --- ANIMAȚII --- */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-smooth {
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.15s; }
        .delay-3 { animation-delay: 0.25s; }
    </style>
</head>
<body>

    <!-- ECRAN 1: PAGINA DE START -->
    <div id="start-screen">
        <div class="content-container">
            <h1 class="animate-smooth delay-1">Forst-Trainer</h1>
            <p class="subtitle animate-smooth delay-2">Ausbildung Wolfenbüttel</p>
        </div>

        <button id="start-btn" class="btn-primary animate-smooth delay-2">Quiz starten</button>
    </div>

    <!-- ECRAN 2: QUIZ -->
    <div id="quiz-screen">
        <div class="top-nav">
            <button id="close-btn" class="nav-icon">✕</button>
        </div>

        <div id="question-wrapper">

                <h2 id="q-title"></h2>
                <span>Wähle die richtige Antwort</span>
            </div>

            <img id="q-image" src="" alt="Knospen" class="question-image animate-smooth delay-2">

            <div id="q-text" class="question-text animate-smooth delay-2"></div>

            <div id="q-options" class="options-container animate-smooth delay-3"></div>

            <div id="result-box" class="result-box">
                <div>Ergebnis</div>
                <div id="result-percent" class="result-score">0%</div>
                <div id="result-detail" class="result-sub"></div>
            </div>

            <button id="next-btn">Nächste Frage</button>
        </div>
    </div>

        function shuffleArray(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        let activeQuestions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let answered = false;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const startBtn = document.getElementById('start-btn');
        const closeBtn = document.getElementById('close-btn');
        const nextBtn = document.getElementById('next-btn');
        const resultBox = document.getElementById('result-box');

        function renderQuestion(index) {
            answered = false;
            resultBox.style.display = "none";
            document.querySelector('.quiz-header').style.display = "block";
            document.getElementById('q-image').style.display = "block";
            document.getElementById('q-text').style.display = "block";
            document.getElementById('q-options').style.display = "grid";

            const q = activeQuestions[index];
            document.getElementById('q-title').textContent = q.title;
            document.getElementById('q-image').src = q.image;

            const textContainer = document.getElementById('q-text');
            textContainer.innerHTML = q.paragraphs.map(p => `<p>${p}</p>`).join("");

            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = "";
            nextBtn.style.display = "none";

            const shuffledOptions = shuffleArray(q.options);
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.textContent = opt.text;
                btn.addEventListener('click', () => checkAnswer(btn, opt.correct));
                optionsContainer.appendChild(btn);
            });
        }

        startBtn.addEventListener('click', function() {
            activeQuestions = shuffleArray(questions);
            currentIndex = 0;
            correctCount = 0;
            startScreen.style.display = 'none';
            quizScreen.style.display = 'flex';
            renderQuestion(currentIndex);
        });

        function goHome() {
            quizScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            nextBtn.style.display = 'none';
            resultBox.style.display = 'none';
        }

        closeBtn.addEventListener('click', goHome);

        function checkAnswer(button, isCorrect) {
            if (answered) return;
            answered = true;

            if (isCorrect) {
                correctCount++;
                button.classList.add('correct');
            } else {
                button.classList.add('wrong');
            }

            if (currentIndex < activeQuestions.length - 1) {
                nextBtn.textContent = "Nächste Frage";
            } else {
                nextBtn.textContent = "Auswertung anzeigen";
            }
            nextBtn.style.display = "flex";
        }

        function showFinalResult() {
            document.querySelector('.quiz-header').style.display = "none";
            document.getElementById('q-image').style.display = "none";
            document.getElementById('q-text').style.display = "none";
            document.getElementById('q-options').style.display = "none";

            const percent = Math.round((correctCount / activeQuestions.length) * 100);
            document.getElementById('result-percent').textContent = percent + "%";
            document.getElementById('result-detail').textContent =
                `${correctCount} von ${activeQuestions.length} Fragen richtig beantwortet`;

            resultBox.style.display = "block";
            nextBtn.textContent = "Zurück zum Start";
            nextBtn.style.display = "flex";
        }

        nextBtn.addEventListener('click', function() {
            if (nextBtn.textContent === "Zurück zum Start") {
                goHome();
                return;
            }

            if (currentIndex < activeQuestions.length - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                showFinalResult();
            }
        });
    </script>
